<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="mei-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="mei-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mei-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板：极光渐变 -->
  <rect x="2" y="2" width="92" height="92" rx="26" fill="url(#mei-bg)"/>
  <!-- 顶部高光 -->
  <rect x="2" y="2" width="92" height="46" rx="26" fill="url(#mei-shine)"/>
  <!-- M 标志（Mei 首字母，书本/门户意象） -->
  <path
    d="M27 68 L27 34 C27 30.7 31.2 29.2 33.6 31.8 L48 47.6 L62.4 31.8 C64.8 29.2 69 30.7 69 34 L69 68"
    fill="none"
    stroke="url(#mei-mark)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- 极光星点 -->
  <circle cx="71.5" cy="24.5" r="4.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="79" cy="33" r="2.2" fill="#ffffff" opacity="0.6"/>
</svg>
