name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.0.0）。留空则用最近 git tag"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Docker 镜像（mei-portal 单镜像，全应用合一）
  #   - 推送到 GHCR（ghcr.io/<owner>/mei-portal）
  #   - 配置 secrets.ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD 和
  #     vars.ACR_REGISTRY / ACR_NAMESPACE 后，同时推送到阿里云 ACR
  #   - 导出 OCI 离线包（linux/amd64 + linux/arm64）作为 Release 附件
  # ---------------------------------------------------------------------------
  docker-image:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 阿里云 ACR（可选）：secrets 缺失时自动跳过，仅推 GHCR
      - name: Login to Aliyun ACR (optional)
        if: env.ALIYUN_ACR_USERNAME != '' && vars.ACR_REGISTRY != ''
        env:
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          input="${{ github.event.inputs.version }}"
          ref="${{ github.ref_name }}"
          if [ -n "$input" ]; then
            v="$input"
          elif [ -n "$ref" ] && [ "${ref#v}" != "$ref" ]; then
            v="$ref"
          else
            v="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          fi
          v="${v#v}"
          echo "APP_VERSION=$v" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          v="${{ steps.ver.outputs.APP_VERSION }}"
          ghcr="ghcr.io/${{ github.repository_owner }}/mei-portal"
          tags="$ghcr:$v,$ghcr:latest"
          if [ -n "${{ secrets.ALIYUN_ACR_USERNAME }}" ] && [ -n "${{ vars.ACR_REGISTRY }}" ]; then
            acr="${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/mei-portal"
            tags="$tags,$acr:$v,$acr:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "tags: $tags"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        env:
          # 禁用 build record 自动上传：*.dockerbuild 产物对发布无价值，
          # 且会让 download-artifact 全量下载时失败
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.APP_VERSION }}
          # 阿里云 ACR（personal 版）不支持 buildx 默认生成的 SLSA provenance
          # attestation（application/vnd.oci.empty.v1+json），推送会被拒：
          # "denied: unknown manifest class for application/vnd.oci.empty.v1+json"
          provenance: false
          sbom: false
          # 层缓存：8 个 builder 的全源码构建非常重，缓存让 OCI 导出步骤
          # 直接复用已推送构建的层（否则同一 Dockerfile 要完整构建两次）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export OCI offline archive
        shell: bash
        run: |
          set -e
          mkdir -p release
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file image/Dockerfile \
            --cache-from type=gha \
            --output type=oci,dest="release/mei-portal-${{ steps.ver.outputs.APP_VERSION }}.oci.tar" \
            .
          ls -lh release/

      - name: Warm GHCR mirror caches (best-effort)
        # 拉取公共 GHCR 镜像的常见国内加速站，触发回源缓存，国内用户后续拉取更快。
        # 镜像需为 public，否则加速站回源 401。失败不影响发布。
        continue-on-error: true
        # docker pull 加速站可能无限挂起，best-effort 步骤不该拖住整个发布。
        timeout-minutes: 3
        shell: bash
        run: |
          v="${{ steps.ver.outputs.APP_VERSION }}"
          for mirror in ghcr.nju.edu.cn ghcr.m.daocloud.io ghcr.dockerproxy.net; do
            img="${{ github.repository_owner }}/mei-portal"
            echo "==> warming $mirror/$img:$v"
            docker pull "$mirror/$img:$v" || echo "!! warm failed for $mirror/$img:$v"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mei-portal-docker
          path: release/mei-portal-*.oci.tar

  # ---------------------------------------------------------------------------
  # 汇总产物到 Release
  # ---------------------------------------------------------------------------
  publish-release:
    needs: [docker-image]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          # 排除 build-push-action 自动上传的 *.dockerbuild 构建记录产物
          pattern: "!*.dockerbuild"

      - name: Organize release files
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.oci.tar' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          # GitHub Release API 拒绝上传空文件（size must be >= 1）
          find release -type f -size 0 -delete
          echo "=== release/ 结构 ==="
          find release -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.docker-image.outputs.version }}
          name: Mei-Portal v${{ needs.docker-image.outputs.version }}
          generate_release_notes: true
          body: |
            ## 使用

            ```bash
            docker run -d --name mei-portal --restart unless-stopped \
              -p 7777:7777 -v mei-portal-data:/data \
              ghcr.io/${{ github.repository_owner }}/mei-portal:${{ needs.docker-image.outputs.version }}
            ```

            国内可拉阿里云 ACR（配置后自动推送）：
            ```${{ vars.ACR_REGISTRY && format('{0}/{1}/mei-portal:{2}', vars.ACR_REGISTRY, vars.ACR_NAMESPACE, needs.docker-image.outputs.version) || ' 未配置 ACR_REGISTRY / ACR_NAMESPACE' }}```

            离线环境：下载附件 `mei-portal-*.oci.tar` 后
            `docker load -i mei-portal-<version>.oci.tar`（多架构 OCI 归档，需 Docker 25+）。

            首次启动后访问 `http://<host>:7777` 完成初始化；数据全部落在 `/data` 卷。
          files: |
            release/*
