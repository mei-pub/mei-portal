# 由 scripts/gen-nginx.mjs 自动生成，请勿手改。
# 修改 plugins/*/manifest.yml 后重新运行 node scripts/gen-nginx.mjs

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 根域 → Shell 门户（${ROOT_DOMAIN} 本身）
server {
    listen 80 default_server;
    server_name ${ROOT_DOMAIN};

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $shell "shall";
        proxy_pass http://$shell:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ai-draw — AI 绘图
server {
    listen 80;
    server_name ${SUBDOMAIN_DRAW}.${ROOT_DOMAIN};

    # theme loader 注入：剥离 iframe 头 + sub_filter（默认对 text/html 生效）
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    sub_filter '</head>' '<script src="${SHELL_ORIGIN}/__theme/loader.js" data-app="ai-draw"></script></head>';
    sub_filter_once on;

    location / {
        # 用变量让 nginx 延迟到请求时解析上游（避免启动时 DNS 失败导致 emerg）
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream "ai-draw";
        proxy_pass http://$upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

