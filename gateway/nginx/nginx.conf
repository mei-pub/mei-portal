# mei-portal 网关主配置
# 职责：反代 Shell 与各应用；对应用剥离 iframe 限制头并注入 theme loader。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志
    log_format main '$remote_addr - $host "$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # 主页背景图/Logo 支持 base64 上传（30MB 图片 → ~40MB JSON body）
    client_max_body_size 64m;

    # 上游应用多为 SPA/流式，gzip 关闭避免 sub_filter 与压缩冲突
    gzip off;

    # 必须开：sub_filter 需要处理完整响应体
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 加载子配置：shell + 各应用
    include /etc/nginx/conf.d/*.conf;
}
