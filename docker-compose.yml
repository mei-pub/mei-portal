# =============================================================================
# mei-portal 单镜像部署
# 所有应用 + Shell + nginx 打包在一个镜像，仅暴露 7777 端口
# =============================================================================
name: mei-portal

services:
  mei-portal:
    build:
      context: .
      dockerfile: image/Dockerfile
    image: mei-portal:latest
    container_name: mei-portal
    restart: unless-stopped
    # 优雅停机：supervisord 需按程序逐个走 SIGTERM（disks 缓存落盘 / media 杀下载子进程
    # 各留了 stopwaitsecs=20），默认 10s 宽限期会被 docker 直接 SIGKILL 截断
    stop_grace_period: 60s
    # 端口说明（镜像内全部监听端口已 Dockerfile EXPOSE 显式声明）：
    #   内部应用（仅容器内，勿映射）：3010 shell / 3001 novels / 3002 link /
    #     3003 tv / 3004 draw / 3005 music / 3008 disks / 3000 media core / 4416 bgutil
    #   引擎控制面：6800 aria2 RPC / 8080 qBittorrent WebUI（下方映射到本机）
    #   BT 数据面：6881 qB（TCP+UDP）/ 6891 aria2（TCP+UDP）——需要公网做种
    #     连通性时按需映射；未映射不影响下载中心内网下载
    ports:
      - "7777:7777"
      # aria2 RPC 对外引擎（第三方客户端接入控制；容器内 6800，secret 见
      # 下载中心设置页「下载引擎」）。绑定 127.0.0.1：本机客户端接入，不经公网
      # 暴露；需要局域网接入时去掉 127.0.0.1: 前缀
      - "127.0.0.1:16800:6800"
      # qBittorrent Web UI（BT/磁力引擎管理界面；容器内 8080，凭据见下载中心
      # 设置页「下载引擎」）。默认限本机访问
      - "127.0.0.1:16801:8080"
    volumes:
      - mei-data:/data
      # 本地服务器下载库（强要求配置）：音乐/影视「下载到本地服务器」的保存目录。
      # 默认落在本仓库 ./downloads（首次 up 自动创建）；指向 NAS/移动硬盘时改
      # MEI_DOWNLOADS_DIR 即可。容器内布局：/downloads/music/<歌手>/、/downloads/movie/<分类>/<剧名>/
      - ${MEI_DOWNLOADS_DIR:-./downloads}:/downloads
    # /healthy 经 nginx 反代到 media core（白名单端点）：同时覆盖 nginx 存活与 core 就绪，
    # 不用 Shell 的 /api/health（它会并发探活全部应用，不适合做容器级心跳）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7777/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    environment:
      # 统一管理员凭据（单用户，首次启动后可在门户修改密码）
      MEI_ADMIN_USER: ${MEI_ADMIN_USER:-admin}
      MEI_ADMIN_PASSWORD: ${MEI_ADMIN_PASSWORD:-mei-portal}
      # 引擎宿主接入端口声明（下载中心设置页「下载引擎」展示接入地址用；
      # 容器内固定 6800/8080，改这里要与 ports 映射一致）
      MEI_ARIA2_RPC_PORT: "16800"
      MEI_QBIT_WEBUI_PORT: "16801"
      # 可选：自动 PO Token 服务异常时手工覆盖。
      YOUTUBE_PO_TOKEN: ${YOUTUBE_PO_TOKEN:-}
      YOUTUBE_VISITOR_DATA: ${YOUTUBE_VISITOR_DATA:-}

volumes:
  mei-data:
