# =============================================================================
# mei-allin 单镜像部署
# 所有应用 + Shell + nginx 打包在一个镜像，仅暴露 7777 端口
# =============================================================================
services:
  mei-allin:
    build:
      context: .
      dockerfile: image/Dockerfile
      # 国内本地构建走 goproxy.cn；CI（release.yml）不传，用默认官方源
      args:
        GOPROXY: https://goproxy.cn,direct
    image: mei-allin:latest
    container_name: mei-allin
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      - mei-data:/data
    environment:
      # 统一管理员凭据（单用户，首次启动后可在门户修改密码）
      MEI_ADMIN_USER: ${MEI_ADMIN_USER:-admin}
      MEI_ADMIN_PASSWORD: ${MEI_ADMIN_PASSWORD:-mei-allin}
      # 可选：自动 PO Token 服务异常时手工覆盖。
      YOUTUBE_PO_TOKEN: ${YOUTUBE_PO_TOKEN:-}
      YOUTUBE_VISITOR_DATA: ${YOUTUBE_VISITOR_DATA:-}

volumes:
  mei-data:
