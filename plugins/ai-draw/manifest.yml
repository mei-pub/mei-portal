id: ai-draw
name: AI 绘图
description: AI 驱动的绘图工具，支持 Excalidraw/Mermaid/Drawio
icon: lucide:pen-tool
category: utility
weight: 10
endpoint: http://ai-draw:3000
ingress:
  mode: subdomain
  host: ${SUBDOMAIN_DRAW}.${ROOT_DOMAIN}
auth:
  strategy: independent
embed:
  iframe: true
  strip_headers: [X-Frame-Options, Content-Security-Policy]
theme:
  has_skin: true
  entry: /__theme/ai-draw.css
health:
  path: /
  expect: 200
upgrade:
  image: ghcr.io/stone-yu/ai-draw:latest
  repo: https://github.com/stone-yu/ai-draw
