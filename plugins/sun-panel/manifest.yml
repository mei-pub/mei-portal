id: sun-panel
name: 主页面板
description: 可作为经典启动器的导航面板（含自定义 JS/CSS）
icon: lucide:layout-dashboard
category: productivity
weight: 5
endpoint: http://sun-panel:3002
ingress:
  mode: subdomain
  host: ${SUBDOMAIN_PANEL}.${ROOT_DOMAIN}
auth:
  strategy: independent
embed:
  iframe: true
  strip_headers: [X-Frame-Options, Content-Security-Policy]
theme:
  has_skin: true
  entry: /__theme/sun-panel.css
health:
  path: /
  expect: 200
upgrade:
  image: hslr/sun-panel:latest
  repo: https://github.com/hslr-s/sun-panel
