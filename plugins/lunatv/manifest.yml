id: lunatv
name: 影视门户
description: 豆瓣式影视聚合与播放
icon: lucide:tv
category: media
weight: 30
endpoint: http://lunatv:3000
ingress:
  mode: subdomain
  host: ${SUBDOMAIN_TV}.${ROOT_DOMAIN}
auth:
  strategy: independent
embed:
  iframe: true
  strip_headers: [X-Frame-Options, Content-Security-Policy]
theme:
  has_skin: true
  entry: /__theme/lunatv.css
health:
  path: /
  expect: 200
upgrade:
  image: ghcr.io/moontechlab/lunatv:latest
  repo: https://github.com/MoonTechLab/LunaTV
