id: solara
name: 音乐播放
description: 沉浸式音乐播放器，专辑配色动态背景
icon: lucide:music
category: media
weight: 40
endpoint: http://solara:8787
ingress:
  mode: subdomain
  host: ${SUBDOMAIN_MUSIC}.${ROOT_DOMAIN}
auth:
  strategy: independent
embed:
  iframe: true
  strip_headers: [X-Frame-Options, Content-Security-Policy]
theme:
  has_skin: true
  entry: /__theme/solara.css
health:
  path: /
  expect: 200
upgrade:
  image: ghcr.io/akudamatata/solara:latest
  repo: https://github.com/akudamatata/Solara
