id: tutorial
name: 小说书架
description: 个人小说库，带蜘蛛纸牌游戏伪装
icon: lucide:book-open
category: productivity
weight: 60
endpoint: http://tutorial:3000
ingress:
  mode: subdomain
  host: ${SUBDOMAIN_NOVELS}.${ROOT_DOMAIN}
