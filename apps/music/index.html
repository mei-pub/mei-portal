<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mei Music</title>
    <meta name="apple-mobile-web-app-title" content="Mei Music">
    <link rel="icon" type="image/svg+xml" href="/music/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/music/favicon.png">
    <link rel="shortcut icon" href="/music/favicon.png">
    <link rel="mask-icon" href="/music/favicon.svg" color="#5bbad5">
    <link rel="apple-touch-icon" sizes="180x180" href="/music/favicon.png">
    <link rel="stylesheet" href="css/mei.css">
</head>
<body>
    <!-- 极光背景 -->
    <div class="mei-aurora" aria-hidden="true">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
    </div>

    <!-- 视图容器（哈希路由渲染：搜索 / 播放列表 / 播放页 / 随便听听 / 我的收藏） -->
    <main id="view" class="mei-main"></main>

    <!-- 抽象播放器组件：底部悬浮播放条 -->
    <div id="playerBar" class="mei-playerbar" style="display:none"></div>

    <script type="module" src="js/mei/main.js"></script>

</html>
