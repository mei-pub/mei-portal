worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # 外部域名/端口映射（如 http://domain:1080 -> localhost:7777）时，
    # 重定向必须保留浏览器原始 Host 和端口，不能生成 nginx 监听端口的绝对地址。
    absolute_redirect off;
    port_in_redirect off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip off;  # sub_filter 需要未压缩响应

    client_max_body_size 100m;

    # 小说站点模型（2026-08）：不再通过 ?lib={id} 注入 auth cookie。
    # 站点按标识路由（/novels/s/{slug}），普通站点公开可访问，
    # 隐秘站点由 ns-open cookie（open:标识:密码 命令）控制可见性与访问。

    # 嵌入模式说明：URL 带 ?meiEmbed=1 时（设置集成页 iframe 内嵌），
    # 顶栏 script 仍注入但由 topbar.js 自行检测参数跳过渲染（仅保留登录态副作用）。
    # 不用 nginx if 控制注入：if 块会导致 alias+try_files 的 SPA fallback 失效（if is evil）。

    # 上游应用（supervisord 管理的内部进程）
    upstream mei_shell     { server 127.0.0.1:3010; }
    upstream mei_tutorial  { server 127.0.0.1:3001; }
    upstream mei_meilink   { server 127.0.0.1:3002; }
    upstream mei_lunatv    { server 127.0.0.1:3003; }
    upstream mei_aidraw    { server 127.0.0.1:3004; }
    upstream mei_solara    { server 127.0.0.1:3005; }
    upstream mei_mediago  { server 127.0.0.1:3000; }
    upstream mei_pansou   { server 127.0.0.1:3008; }

    # 各应用子路径前缀与顶栏注入的 app id 映射
    # 注：location 块由 conf.d/*.conf 提供

    include /etc/nginx/conf.d/*.conf;
}
