worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip off;  # sub_filter 需要未压缩响应

    client_max_body_size 100m;

    # 上游应用（supervisord 管理的内部进程）
    upstream mei_shell     { server 127.0.0.1:3000; }
    upstream mei_tutorial  { server 127.0.0.1:3001; }
    upstream mei_meilink   { server 127.0.0.1:3002; }
    upstream mei_lunatv    { server 127.0.0.1:3003; }
    upstream mei_aidraw    { server 127.0.0.1:3004; }
    upstream mei_solara    { server 127.0.0.1:3005; }

    # 各应用子路径前缀与顶栏注入的 app id 映射
    # 注：location 块由 conf.d/*.conf 提供

    include /etc/nginx/conf.d/*.conf;
}
