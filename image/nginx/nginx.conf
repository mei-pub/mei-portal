worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # 外部域名/端口映射（如 http://domain:1080 -> localhost:7777）时，
    # 重定向必须保留浏览器原始 Host 和端口，不能生成 nginx 监听端口的绝对地址。
    absolute_redirect off;
    port_in_redirect off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip off;  # sub_filter 需要未压缩响应

    client_max_body_size 100m;

    # 小说站点模型（2026-08）：不再通过 ?lib={id} 注入 auth cookie。
    # 站点按标识路由（/novels/s/{slug}），普通站点公开可访问，
    # 隐秘站点由 ns-open cookie（open:标识:密码 命令）控制可见性与访问。

    # 嵌入模式说明：URL 带 ?meiEmbed=1 时（设置集成页 iframe 内嵌），
    # 顶栏 script 仍注入但由 topbar.js 自行检测参数跳过渲染（仅保留登录态副作用）。
    # 不用 nginx if 控制注入：if 块会导致 alias+try_files 的 SPA fallback 失效（if is evil）。

    # 上游应用（supervisord 管理的内部进程）
    upstream mei_shell     { server 127.0.0.1:3010; }
    upstream mei_novels   { server 127.0.0.1:3001; }
    upstream mei_link      { server 127.0.0.1:3002; }
    upstream mei_tv       { server 127.0.0.1:3003; }
    upstream mei_draw     { server 127.0.0.1:3004; }
    upstream mei_music    { server 127.0.0.1:3005; }
    upstream mei_media    { server 127.0.0.1:3000; }
    upstream mei_disks    { server 127.0.0.1:3008; }

    # ---- 静态资源缓存策略 ----
    # 上游普遍下发 Cache-Control: public, max-age=0 且无 ETag，导致每次切换应用
    # 都要把整套 JS/CSS/字体重新拉一遍。公网 + 端口映射下单次往返约 0.25s，
    # 十来个资源串起来就是好几秒白屏 —— 这是「跳转应用特别慢」的主因之一。
    #
    # 两条禁忌（踩过）：
    #   1) 不能在 server 级 proxy_hide_header Cache-Control：会一并剥掉 HTML/API 的
    #      no-store，登录态页面被缓存。
    #   2) 不能加静态资源的正则 location：正则优先级高于前缀，会抢走各应用的
    #      location 并丢掉它们的 proxy_pass / sub_filter（sub_filter 也作用于 JS/CSS
    #      做子路径改写，必须保留）。
    # 因此改用 map 按 URI 派生策略，在 server 级统一下发（见 conf.d/00-main.conf），
    # 未命中静态策略时回填上游原值，HTML / API / 音频代理都不受影响。
    map $uri $mei_static_cache {
        default                                  "";
        # 构建产物带内容哈希，可长期强缓存
        # 含 {n,} 量词的正则必须整体加引号，否则 nginx 会把 { 当成块起始而拒绝启动
        ~*/_next/static/                         "public, max-age=31536000, immutable";
        "~*/assets/[^/]*[.-][0-9a-f]{8,}\.[a-z0-9]+$"  "public, max-age=31536000, immutable";
        ~*\.(?:woff2?|ttf|otf|eot)$              "public, max-age=604800";
        ~*\.(?:png|jpe?g|gif|svg|webp|avif|ico)$ "public, max-age=86400";
        # 无哈希的裸 JS/CSS（solara 等原生应用）：短缓存 + 后台校验，
        # 既省掉重复往返，改版后也能在 5 分钟内自然更新
        ~*\.(?:js|mjs|css)$                      "public, max-age=300, stale-while-revalidate=86400";
    }

    # 最终下发的 Cache-Control。
    # 直接 add_header 会与上游的头叠加成两条 Cache-Control（浏览器取更严格的那条，
    # 长缓存失效），所以统一 proxy_hide_header 掉上游的头，再由本 map 决定：
    # 命中静态策略就用策略值，否则把上游原值原样回填（上游没有则不下发）。
    # 这样 HTML 的 no-store、API 的 private、音频代理的 range 语义全部不受影响。
    map $mei_static_cache $mei_cache_control {
        ""      $upstream_http_cache_control;
       default $mei_static_cache;
   }

    # Top-level document requests render the portal shell; iframe navigations and
    # subresources continue to the real application upstream.
    #
    # Primary signal: Sec-Fetch-Dest (browser sends automatically).
    # Fallback when reverse proxy strips Sec-Fetch-Dest:
    #   1. If URL contains meiEmbed=1 → always iframe, skip Shell
    #   2. If Accept header starts with text/html and no meiEmbed → treat as document
    #   3. If Sec-Fetch-Dest is explicitly iframe/image/script/style etc → skip Shell

    map $http_sec_fetch_dest $mei_document_request {
        default  0;
        document 1;
    }
    # When Sec-Fetch-Dest is absent (reverse proxy stripped it), fall back to
    # checking Accept header. iframe requests carry meiEmbed=1 in the URL, so
    # a request with Accept: text/html and no meiEmbed param is a top-level document.
    map $http_accept $mei_html_accept {
        default  0;
        "~^text/html" 1;
    }
    map $args $mei_has_embed {
        default 0;
        "~meiEmbed=1" 1;
    }
    # Composite: 1 when Sec-Fetch-Dest=document OR (no SFD + html accept + no embed)
    # Route to Shell when:
    #   1) Sec-Fetch-Dest=document (100 or 110), OR
    #   2) Sec-Fetch-Dest absent + Accept=text/html + no meiEmbed (010)
    # Never route to Shell when meiEmbed=1 (last digit=1)
    map "$mei_document_request$mei_html_accept$mei_has_embed" $mei_is_doc {
        default 0;
        "100" 1;  # SFD=doc, accept=html, no embed → doc
        "101" 0;  # SFD=doc, accept=html, has embed → NOT doc (embed wins)
        "110" 1;  # SFD=doc, accept=other, no embed → doc (SFD wins)
        "111" 0;  # SFD=doc + embed → NOT doc
        "010" 1;  # SFD absent, accept=html, no embed → fallback doc
        "011" 0;  # SFD absent, accept=html, has embed → NOT doc
        "000" 0;  # nothing → not doc
        "001" 0;  # has embed only → not doc
    }

    # 各应用子路径前缀与顶栏注入的 app id 映射
    # 注：location 块由 conf.d/*.conf 提供

    include /etc/nginx/conf.d/*.conf;
}
