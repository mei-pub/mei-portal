worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip off;  # sub_filter 需要未压缩响应

    client_max_body_size 100m;

    # 根据 ?lib={id} URL 参数生成 tutorial 的 auth cookie（多书架模式）
    # 仅匹配数字 id，防止 cookie 注入；无参数时默认 library 1（无密码书架）
    map $arg_lib $mei_lib_cookie {
        default "auth-token=1%3A";
        ~^(?<lib_id>[0-9]+)$ "auth-token=$lib_id%3A";
    }

    # 检查浏览器是否已携带 auth-token cookie（例如伪装页自动登录后）
    # 若已携带，则不覆盖（保留用户已登录的书架会话），避免密码书架被 map 默认值冲掉
    map $http_cookie $mei_has_auth_token {
        default 0;
        ~auth-token= 1;
    }

    # 最终注入给 tutorial 的 Cookie：有浏览器 cookie 时透传，否则用 map 默认值
    map "$mei_has_auth_token" $mei_inject_cookie {
        default "$http_cookie";
        "0" "$mei_lib_cookie";
    }

    # 嵌入模式说明：URL 带 ?meiEmbed=1 时（设置集成页 iframe 内嵌），
    # 顶栏 script 仍注入但由 topbar.js 自行检测参数跳过渲染（仅保留登录态副作用）。
    # 不用 nginx if 控制注入：if 块会导致 alias+try_files 的 SPA fallback 失效（if is evil）。

    # 上游应用（supervisord 管理的内部进程）
    upstream mei_shell     { server 127.0.0.1:3010; }
    upstream mei_tutorial  { server 127.0.0.1:3001; }
    upstream mei_meilink   { server 127.0.0.1:3002; }
    upstream mei_lunatv    { server 127.0.0.1:3003; }
    upstream mei_aidraw    { server 127.0.0.1:3004; }
    upstream mei_solara    { server 127.0.0.1:3005; }
    upstream mei_sunpanel  { server 127.0.0.1:3006; }
    upstream mei_mediago  { server 127.0.0.1:3000; }
    upstream mei_pansou   { server 127.0.0.1:3008; }

    # 各应用子路径前缀与顶栏注入的 app id 映射
    # 注：location 块由 conf.d/*.conf 提供

    include /etc/nginx/conf.d/*.conf;
}
