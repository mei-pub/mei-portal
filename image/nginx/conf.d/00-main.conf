# =============================================================================
# mei-allin 同源路径反代 + 统一顶栏注入
# 所有应用在同源不同子路径，nginx 反代到内部端口
# sub_filter 在每个应用 HTML 注入统一顶栏挂载点 + 主题
# =============================================================================

# 顶栏注入片段（被各应用 location 引用）
# 注入：1) 主题 CSS  2) 顶栏 JS bundle  3) 顶栏挂载占位
# 顶栏 JS 从 Shell 提供（/__shell/topbar.js），运行在各应用页面内

# ---- 根域 → Shell 门户 ----
server {
    listen 7777 default_server;
    server_name _;

    # 静态资源：Shell 的主题/顶栏资产（所有应用共享）
    location /__shell/ {
        proxy_pass http://mei_shell/__shell/;
    }
    # tokens.css 别名（顶栏依赖）
    location = /__shell/tokens.css {
        proxy_pass http://mei_shell/__theme/tokens.css;
    }

    # Shell API（登录、代理、插件）
    location /api/ {
        proxy_pass http://mei_shell/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # mediago 专属路径（JS 动态 import 用根路径，子路径 sub_filter 无法覆盖）
    # /assets/ 只有 mediago 用根路径，其他应用都在各自子路径
    location ^~ /assets/ {
        proxy_pass http://mei_mediago;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
    # mediago API（非 Shell 的 auth/plugins/health）
    location ~ ^/api/(tasks|config|downloads|favorites|conversions)(/|$) {
        proxy_pass http://mei_mediago;
        proxy_set_header Host $host;
    }
    # mediago SSE（Server-Sent Events 流式连接，需关闭 buffering + 长超时）
    location = /api/events {
        proxy_pass http://mei_mediago;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }
    location ~ ^/api/auth/(status|signin|setup) {
        proxy_pass http://mei_mediago;
        proxy_set_header Host $host;
    }
    location ~ ^/api/v1/ {
        proxy_pass http://mei_mediago;
        proxy_set_header Host $host;
    }
    # mediago 页面路由
    # /signin：mediago SPA 未登录时重定向到此。注入 apiKey 脚本：
    #   1) 若用户已登录 Shell → 注入 mediago token 到 localStorage 并跳转回 /media/
    #   2) 未登录 → 显示 mediago 原生登录页（手动输入密码）
    location = /signin {
        proxy_pass http://mei_mediago;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        sub_filter_types text/html;
        sub_filter '</head>' '<script>try{var x=new XMLHttpRequest();x.open("GET","/api/auth/me",false);x.withCredentials=true;x.send();if(x.status===200){var d=JSON.parse(x.responseText);if(d.tokens&&d.tokens.mediago){var s=localStorage.getItem("app-store")||"{}";var p=JSON.parse(s);if(!p.state)p.state={};if(!p.state.app)p.state.app={};p.state.app.apiKey=d.tokens.mediago;p.version=p.version||0;localStorage.setItem("app-store",JSON.stringify(p));window.location.replace("/media/");}}}catch(e){}</script></head>';
        sub_filter_once on;
    }
    location = /healthy {
        proxy_pass http://mei_mediago;
    }
    location /player/ {
        proxy_pass http://mei_mediago;
        proxy_set_header Host $host;
    }
    location /videos/ {
        proxy_pass http://mei_mediago;
        proxy_set_header Host $host;
    }
    location = /manifest.json {
        # mediago 没有真正的 manifest.json（返回 index.html → SPA fallback → HTML 导致 Manifest 语法错误）
        # 返回最小有效的 manifest JSON，避免浏览器控制台报错
        default_type application/json;
        return 200 '{"name":"MediaGo","short_name":"MediaGo","start_url":"/media/","display":"standalone","background_color":"#ffffff","theme_color":"#1976d2","icons":[]}';
    }
    location = /share {
        proxy_pass http://mei_mediago;
        proxy_set_header Host $host;
    }

    # Shell 默认路由：所有非应用子路径（/、/login、/_next 等）走 Shell
    location / {
        proxy_pass http://mei_shell;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 应用子路径（各自 location，注入顶栏）----

    # tutorial 小说站（Next.js basePath=/novels）
    # 根据 ?lib={id} URL 参数注入对应 library 的 auth cookie（多书架模式）
    # 但若浏览器已携带 auth-token（伪装页自动登录后），透传浏览器 cookie 保留登录会话
    location /novels {
        proxy_pass http://mei_tutorial;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $mei_inject_cookie;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # 蜘蛛纸牌（Shell 框架级独立入口，始终可见）
    # /games/spider 由 Shell 直接渲染（packages/shall/src/app/games/spider/）
    # 顶栏通过 next/script 组件加载（避免被 React hydration 移除）
    location = /games {
        return 301 /games/spider;
    }
    location /games/ {
        proxy_pass http://mei_shell;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # mei-link（原生 JS，子路径 /link）—— 资源路径 + API 路径重写 + 顶栏
    location /link/ {
        proxy_pass http://mei_meilink/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        # 对 HTML 和 JS 做路径重写（app.js 里 fetch 用绝对 /api/，需加子路径前缀）
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter 'src="/app.js"' 'src="/link/app.js"';
        sub_filter 'href="/style.css"' 'href="/link/style.css"';
        sub_filter 'fetch("/api/' 'fetch("/link/api/';
        sub_filter 'api("/api/' 'api("/link/api/';
        sub_filter '"/api/' '"/link/api/';
        # 嵌入模式（?meiEmbed=1）不注入顶栏
        set $mei_topbar_tag '<script src="/__shell/topbar.js" data-app="mei-link"></script>';
        if ($mei_embed_inject = 0) { set $mei_topbar_tag ''; }
        sub_filter '</head>' '$mei_topbar_tag</head>';
        sub_filter_once off;
    }
    location = /link {
        return 301 /link/;
    }

    # lunatv 影视门户（Next.js basePath=/tv，单密码模式，登录后 cookie=auth）
    location /tv {
        proxy_pass http://mei_lunatv;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # omni-tools（纯静态，子路径 /tools/，sub_filter 注入顶栏）
    location /tools/ {
        alias /app/apps/omni-tools/;
        try_files $uri $uri/ /tools/index.html;
        set $mei_topbar_tag '<script src="/__shell/topbar.js" data-app="omni-tools"></script>';
        if ($mei_embed_inject = 0) { set $mei_topbar_tag ''; }
        sub_filter '</head>' '$mei_topbar_tag</head>';
        sub_filter_once on;
    }
    location = /tools {
        return 301 /tools/;
    }

    # ai-draw：静态 nginx 服务 dist + API 反代 Express（strip /draw）
    location /draw/api/ {
        rewrite ^/draw(/api/.*)$ $1 break;
        proxy_pass http://mei_aidraw;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
    location /draw/ {
        alias /app/apps/ai-draw/dist/;
        try_files $uri $uri/ /draw/index.html;
        sub_filter_types text/html application/javascript text/javascript;
        # JS 里硬编码根级绝对路径的图片（/quick-start-example-1.png 等）→ 改写为 /draw/ 前缀
        # 否则浏览器请求 /xxx.png → 命中根 / location（Shell）→ 404
        sub_filter '"/quick-start-example-1.png"' '"/draw/quick-start-example-1.png"';
        sub_filter '"/ali-pay.png"' '"/draw/ali-pay.png"';
        sub_filter '"/contact-single.png"' '"/draw/contact-single.png"';
        sub_filter '"/wechart-pay.png"' '"/draw/wechart-pay.png"';
        # 注入顶栏（嵌入模式 ?meiEmbed=1 时不注入）
        set $mei_topbar_tag '<script src="/__shell/topbar.js" data-app="ai-draw"></script>';
        if ($mei_embed_inject = 0) { set $mei_topbar_tag ''; }
        sub_filter '</head>' '$mei_topbar_tag</head>';
        sub_filter_once off;
    }
    location = /draw {
        return 301 /draw/;
    }

    # solara（Node + 原生 JS，子路径 /music）—— 资源 + API 路径重写 + 顶栏
    location /music/ {
        proxy_pass http://mei_solara/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        sub_filter_types text/html application/javascript text/javascript text/css;
        # API/路由绝对路径加子路径前缀
        sub_filter '"/api/' '"/music/api/';
        sub_filter "'/api/" "'/music/api/";
        sub_filter '"/proxy' '"/music/proxy';
        sub_filter "'/proxy" "'/music/proxy";
        sub_filter '"/palette' '"/music/palette';
        sub_filter "'/palette" "'/music/palette";
        sub_filter '"/login' '"/music/login';
        sub_filter "'/login" "'/music/login";
        sub_filter '"/css/' '"/music/css/';
        sub_filter '"/js/' '"/music/js/';
        # 注入顶栏（嵌入模式 ?meiEmbed=1 时不注入）
        set $mei_topbar_tag '<script src="/__shell/topbar.js" data-app="solara"></script>';
        if ($mei_embed_inject = 0) { set $mei_topbar_tag ''; }
        sub_filter '</head>' '$mei_topbar_tag</head>';
        sub_filter_once off;
    }
    location = /music {
        return 301 /music/;
    }

    # sun-panel：API 原样透传（Go 有 /panel/api 路由），静态/页面 strip /panel（Go 静态在根）
    location /panel/api/ {
        proxy_pass http://mei_sunpanel;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
    # sun-panel 上传文件 StaticFS：Go router.Static(sourcePath[1:], source_path)
    # 注册在 router（非 /panel 组），路由为 /uploads/...，而非 /panel/uploads/...
    # 所以直接 proxy /uploads/ 到 sun-panel（不要 strip，不要加 /panel 前缀）
    location /uploads/ {
        proxy_pass http://mei_sunpanel;
        proxy_set_header Host $host;
    }
    # 兼容：若前端拿到 /panel/uploads/... 路径（sub_filter 改写后），strip /panel 再转发
    location /panel/uploads/ {
        rewrite ^/panel(/uploads/.*)$ $1 break;
        proxy_pass http://mei_sunpanel;
        proxy_set_header Host $host;
    }
    # sun-panel 自定义 JS/CSS（用户可选，不存在时返回空 200 避免 404 噪音）
    location ~ ^/custom/(index\.(js|css))$ {
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache";
        return 200 "";
    }
    location /panel/ {
        rewrite ^/panel(/.*)$ $1 break;
        proxy_pass http://mei_sunpanel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        # 含 application/json：uploadImg 等接口返回 JSON 含 /uploads/... 路径，需重写为 /panel/uploads/...
        sub_filter_types text/html application/javascript text/javascript application/json;
        # JS 内硬编码 /api/ 改为 /panel/api/（Go 有 /panel/api 路由）
        sub_filter '"/api/' '"/panel/api/';
        sub_filter "'/api/" "'/panel/api/";
        # 上传文件回显 URL：Go 返回 /uploads/... → 改写为 /panel/uploads/...
        sub_filter '"/uploads/' '"/panel/uploads/';
        sub_filter "'/uploads/" "'/panel/uploads/";
        # 注入顶栏（嵌入模式 ?meiEmbed=1 时不注入）
        set $mei_topbar_tag '<script src="/__shell/topbar.js" data-app="sun-panel"></script>';
        if ($mei_embed_inject = 0) { set $mei_topbar_tag ''; }
        sub_filter '</head>' '$mei_topbar_tag</head>';
        sub_filter_once off;
    }
    location = /panel {
        return 301 /panel/;
    }

    # mediago（Go，子路径 /media）—— 同步注入 apiKey + 资源路径 + 顶栏 + 路由前缀修正
    location /media/ {
        rewrite ^/media(/.*)$ $1 break;
        proxy_pass http://mei_mediago;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter 'src="/assets/' 'src="/media/assets/';
        sub_filter 'href="/assets/' 'href="/media/assets/';
        sub_filter '"/assets/' '"/media/assets/';
        sub_filter '"/api/' '"/media/api/';
        sub_filter '"/signin' '"/media/signin';
        # manifest.json：mediago HTML 用根路径 href="/manifest.json"，重写为 /media/manifest.json 避免命中根 location
        sub_filter 'href="/manifest.json"' 'href="/media/manifest.json"';
        # 注入 apiKey + 路由前缀修正 + 顶栏（嵌入模式 ?meiEmbed=1 时不注入顶栏）
        set $mei_topbar_tag '<script src="/__shell/topbar.js" data-app="mediago"></script>';
        if ($mei_embed_inject = 0) { set $mei_topbar_tag ''; }
        sub_filter '</head>' '<script>try{var x=new XMLHttpRequest();x.open("GET","/api/auth/me",false);x.withCredentials=true;x.send();if(x.status===200){var d=JSON.parse(x.responseText);if(d.tokens&&d.tokens.mediago){var s=localStorage.getItem("app-store")||"{}";var p=JSON.parse(s);if(!p.state)p.state={};if(!p.state.app)p.state.app={};p.state.app.apiKey=d.tokens.mediago;p.version=p.version||0;localStorage.setItem("app-store",JSON.stringify(p));}}}catch(e){}</script><script>(function(){var P="/media";var L=window.location;if(L.pathname.indexOf(P+"/")===0||L.pathname===P){var op=Object.getOwnPropertyDescriptor(window.Location.prototype,"pathname");if(op&&op.get){try{Object.defineProperty(window.Location.prototype,"pathname",{get:function(){var r=op.get.call(this);if(this===window.location&&r.indexOf(P)===0){return r.slice(P.length)||"/";}return r;},configurable:true});}catch(e){}}var hp=history.pushState;var hr=history.replaceState;history.pushState=function(s,t,u){if(u&&typeof u==="string"&&u[0]==="/"&&u.indexOf(P)!==0){u=P+u;}return hp.call(this,s,t,u);};history.replaceState=function(s,t,u){if(u&&typeof u==="string"&&u[0]==="/"&&u.indexOf(P)!==0){u=P+u;}return hr.call(this,s,t,u);};}})();</script>$mei_topbar_tag</head>';
        sub_filter_once off;
    }
    # mediago manifest.json：返回最小有效 manifest，避免浏览器报 Manifest 语法错误
    # mediago 没有真正的 manifest（/manifest.json 返回 index.html SPA fallback → HTML → 语法错误）
    location = /media/manifest.json {
        default_type application/json;
        return 200 '{"name":"MediaGo","short_name":"MediaGo","start_url":"/media/","display":"standalone","background_color":"#ffffff","theme_color":"#1976d2","icons":[]}';
    }
    location = /media {
        return 301 /media/;
    }

    # pansou 网盘搜索（Go 后端 + Vite SPA，子路径 /search）
    # 后端 API + 插件路由 strip /search 前缀，前端 SPA 静态文件 alias + sub_filter 重写绝对路径
    # 前端 JS 硬编码绝对路径 /api/、/qqpd/ 等，sub_filter 改写为 /search/... 前缀
    location /search/api/ {
        rewrite ^/search(/api/.*)$ $1 break;
        proxy_pass http://mei_pansou;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer $http_referer;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location /search/qqpd/ {
        rewrite ^/search(/qqpd/.*)$ $1 break;
        proxy_pass http://mei_pansou;
        proxy_set_header Host $host;
        proxy_set_header Referer $http_referer;
        proxy_buffering off;
    }
    location /search/gying/ {
        rewrite ^/search(/gying/.*)$ $1 break;
        proxy_pass http://mei_pansou;
        proxy_set_header Host $host;
        proxy_set_header Referer $http_referer;
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    location /search/weibo/ {
        rewrite ^/search(/weibo/.*)$ $1 break;
        proxy_pass http://mei_pansou;
        proxy_set_header Host $host;
        proxy_set_header Referer $http_referer;
        proxy_buffering off;
    }
    location /search/panlian/ {
        rewrite ^/search(/panlian/.*)$ $1 break;
        proxy_pass http://mei_pansou;
        proxy_set_header Host $host;
        proxy_set_header Referer $http_referer;
        proxy_buffering off;
    }
    # 前端 SPA 静态文件 + 顶栏注入 + 绝对路径重写
    location /search/ {
        alias /app/apps/pansou/frontend/dist/;
        try_files $uri $uri/ /search/index.html;
        sub_filter_types text/html application/javascript text/javascript text/css;
        # HTML 里的 Vite 绝对资源路径改写为 /search 前缀
        # 否则 /assets/... 会命中根级 location ^~ /assets/ → 误路由到 mediago → 404 → SPA fallback 返 HTML → MIME 报错
        sub_filter 'src="/assets/' 'src="/search/assets/';
        sub_filter 'href="/assets/' 'href="/search/assets/';
        sub_filter 'href="/favicon.ico"' 'href="/search/favicon.ico"';
        # 前端 JS 硬编码绝对路径改写为 /search 前缀
        sub_filter '"/api/' '"/search/api/';
        sub_filter "'/api/" "'/search/api/";
        sub_filter '"/qqpd/' '"/search/qqpd/';
        sub_filter "'/qqpd/" "'/search/qqpd/";
        sub_filter '"/gying/' '"/search/gying/';
        sub_filter "'/gying/" "'/search/gying/";
        sub_filter '"/weibo/' '"/search/weibo/';
        sub_filter "'/weibo/" "'/search/weibo/";
        sub_filter '"/panlian/' '"/search/panlian/';
        sub_filter "'/panlian/" "'/search/panlian/";
        # axios baseURL 不含末尾斜杠，上面的规则匹配不到（需 "/api/ 带斜杠才匹配）
        # 不重写则 Xs.get("/health") → /api/health → 命中根 /api/ → Shell 的 health 端点（返回 {apps:[]} 无 channels）
        # → SearchConfig 组件 o.value.channels is not iterable 白屏
        sub_filter 'baseURL:"/api"' 'baseURL:"/search/api"';
        sub_filter "baseURL:'/api'" "baseURL:'/search/api'";
        sub_filter 'baseURL:"/qqpd"' 'baseURL:"/search/qqpd"';
        sub_filter "baseURL:'/qqpd'" "baseURL:'/search/qqpd'";
        sub_filter 'baseURL:"/gying"' 'baseURL:"/search/gying"';
        sub_filter "baseURL:'/gying'" "baseURL:'/search/gying'";
        sub_filter 'baseURL:"/weibo"' 'baseURL:"/search/weibo"';
        sub_filter "baseURL:'/weibo'" "baseURL:'/search/weibo'";
        sub_filter 'baseURL:"/panlian"' 'baseURL:"/search/panlian"';
        sub_filter "baseURL:'/panlian'" "baseURL:'/search/panlian'";
        # 注入顶栏（嵌入模式 ?meiEmbed=1 时不注入）
        set $mei_topbar_tag '<script src="/__shell/topbar.js" data-app="pansou"></script>';
        if ($mei_embed_inject = 0) { set $mei_topbar_tag ''; }
        sub_filter '</head>' '$mei_topbar_tag</head>';
        sub_filter_once off;
    }
    location = /search {
        return 301 /search/;
    }
}
