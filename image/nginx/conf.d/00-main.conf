# =============================================================================
# mei-portal 同源路径反代 + 统一顶栏注入
# 所有应用在同源不同子路径，nginx 反代到内部端口
# sub_filter 在每个应用 HTML 注入统一顶栏挂载点 + 主题
# =============================================================================

# 顶栏注入片段（被各应用 location 引用）
# 注入：1) 主题 CSS  2) 顶栏 JS bundle  3) 顶栏挂载占位
# 顶栏 JS 从 Shell 提供（/__shell/topbar.js），运行在各应用页面内

# ---- 根域 → Shell 门户 ----
server {
    listen 7777 default_server;
    server_name _;

    # $http_host preserves non-standard ports (for example domain:1080).
    include /etc/nginx/snippets/forwarded-headers.conf;

    # 静态资源缓存（策略见 nginx.conf 的 $mei_static_cache / $mei_cache_control）。
    # 兜底：只覆盖那些既没写 add_header 也没写 proxy_hide_header 的 location。
    # 其余 location 必须自行 include snippets/cache-policy.conf（原因见该文件注释）。
    include /etc/nginx/snippets/cache-policy.conf;

    # 应用 location 中的顶层 document 请求通过 418 内部跳到 Shell。
    error_page 418 = @mei_shell;

    # 静态资源：Shell 的主题/顶栏资产（所有应用共享）
    # 顶栏逻辑随域名/路径规则演进，必须即时生效，避免浏览器使用旧缓存。
    location = /__shell/topbar.js {
        proxy_pass http://mei_shell/__shell/topbar.js;
        add_header Cache-Control "no-store, must-revalidate";
    }
    location /__shell/ {
        proxy_pass http://mei_shell/__shell/;
    }
    # tokens.css 别名（顶栏依赖）
    location = /__shell/tokens.css {
        proxy_pass http://mei_shell/__theme/tokens.css;
    }

    # Shell API（登录、代理、插件）
    # 搜索封面等门户 API 必须优先于通用 /api/ 代理，避免被应用 API 分流规则吞掉。
    location = /api/search {
        proxy_pass http://mei_shell;
    }
    location ^~ /api/search/ {
        proxy_pass http://mei_shell;
    }
    location /api/ {
        proxy_pass http://mei_shell/api/;
    }

    # mediago 专属路径（JS 动态 import 用根路径，子路径 sub_filter 无法覆盖）
    # /assets/ 只有 mediago 用根路径，其他应用都在各自子路径
    location ^~ /assets/ {
        proxy_pass http://mei_media;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        include /etc/nginx/snippets/cache-policy.conf;
    }
    # mediago API（非 Shell 的 auth/plugins/health）
    location ~ ^/api/(tasks|config|downloads|favorites|conversions)(/|$) {
        proxy_pass http://mei_media;
    }
    # mediago SSE（Server-Sent Events 流式连接，需关闭 buffering + 长超时）
    location = /api/events {
        proxy_pass http://mei_media;
        include /etc/nginx/snippets/forwarded-headers.conf;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }
    location ~ ^/api/auth/(status|signin|setup) {
        proxy_pass http://mei_media;
    }
    location ~ ^/api/v1/ {
        proxy_pass http://mei_media;
    }
    # mediago 页面路由
    # /signin：mediago SPA 未登录时重定向到此。注入 apiKey 脚本：
    #   1) 若用户已登录 Shell → 注入 mediago token 到 localStorage 并跳转回 /media/
    #   2) 未登录 → 显示 mediago 原生登录页（手动输入密码）
    location = /signin {
        proxy_pass http://mei_media;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        sub_filter_types text/html;
        sub_filter '</head>' '<script>try{var x=new XMLHttpRequest();x.open("GET","/api/auth/me",false);x.withCredentials=true;x.send();if(x.status===200){var d=JSON.parse(x.responseText);if(d.tokens&&d.tokens.mediago){var s=localStorage.getItem("appstore-storage")||"{}";var p=JSON.parse(s);if(!p.state||typeof p.state!=="object")p.state={};p.state.apiKey=d.tokens.mediago;p.version=p.version||0;localStorage.setItem("appstore-storage",JSON.stringify(p));window.location.replace("/media/");}}}catch(e){}</script></head>';
        sub_filter_once on;
    }
    location = /healthy {
        proxy_pass http://mei_media;
    }
    location /player/ {
        proxy_pass http://mei_media;
    }
    location /videos/ {
        proxy_pass http://mei_media;
    }
    location = /manifest.json {
        # mediago 没有真正的 manifest.json（返回 index.html → SPA fallback → HTML 导致 Manifest 语法错误）
        # 返回最小有效的 manifest JSON，避免浏览器控制台报错
        default_type application/json;
        return 200 '{"name":"MediaGo","short_name":"MediaGo","start_url":"/media/","display":"standalone","background_color":"#ffffff","theme_color":"#1976d2","icons":[]}';
    }
    location = /share {
        proxy_pass http://mei_media;
    }

    # Shell 默认路由：所有非应用子路径（/、/login、/_next 等）走 Shell
    location / {
        proxy_pass http://mei_shell;
    }

    location @mei_shell {
        proxy_pass http://mei_shell;
    }

    # ---- 应用子路径（各自 location，注入顶栏）----

    # novels 小说阅读（Next.js basePath=/novels）
    # 站点模型：普通站点公开，隐秘站点由 ns-open cookie 控制，无需注入任何凭证
   location /novels {
        if ($mei_is_doc) { return 418; }
       proxy_pass http://mei_novels;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        include /etc/nginx/snippets/cache-policy.conf;
    }

    # mei-link（Node/TS 服务 + 原生 JS 前端，子路径 /link）—— 资源路径 + API 路径重写 + 顶栏
   location /link/ {
        if ($mei_is_doc) { return 418; }
       proxy_pass http://mei_link/;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        include /etc/nginx/snippets/cache-policy.conf;
        # 对 HTML 和 JS 做路径重写（app.js 里 fetch 用绝对 /api/，需加子路径前缀）
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter 'src="/app.js"' 'src="/link/app.js"';
        sub_filter 'href="/style.css"' 'href="/link/style.css"';
        sub_filter 'fetch("/api/' 'fetch("/link/api/';
        sub_filter 'api("/api/' 'api("/link/api/';
        sub_filter '"/api/' '"/link/api/';
        # 顶栏注入（嵌入模式 ?meiEmbed=1 由 topbar.js 自行检测跳过渲染；
        # 不用 if+set 控制——nginx 的 if 块会让 alias+try_files 的 SPA fallback 失效）
        # 统一身份：mei-link 直接校验门户 mei-auth 会话，无需登录引导注入
        sub_filter '</head>' '<script src="/__shell/topbar.js?v=20260910" data-app="mei-link"></script></head>';
        sub_filter_once off;
    }
   location = /link {
        if ($mei_is_doc) { return 418; }
       return 301 /link/$is_args$args;
    }

    # tv 影视门户（Next.js 14，basePath=/tv，单密码模式，登录后 cookie=auth）
   location /tv {
        if ($mei_is_doc) { return 418; }
       proxy_pass http://mei_tv;
        # 与 solara 同理：middleware 认证失败重定向 /login 为根相对路径，
        # 改写回 /tv/login，避免 cookie 过期后跳出到门户首页。
        # 注意排除 /tv 本身（Next 去尾斜杠 308：/tv/ → /tv，已是正确目标，不能再加前缀）
        proxy_redirect ~^https?://$http_host/(?!tv(?:/|$))(.*)$ /tv/$1;
        proxy_redirect ~^/(?!tv(?:/|$))(.*)$ /tv/$1;
       proxy_http_version 1.1;
       proxy_hide_header X-Frame-Options;
       proxy_hide_header Content-Security-Policy;
       include /etc/nginx/snippets/cache-policy.conf;
        # SSE 流式搜索需关闭 buffering + 长超时（与 mediago /api/events 同理）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        chunked_transfer_encoding off;
   }

   # omni-tools（纯静态，子路径 /tools/，sub_filter 注入顶栏）
   location /tools/ {
        if ($mei_is_doc) { return 418; }
       alias /app/apps/tools/;
        try_files $uri $uri/ /tools/index.html;
        # alias 静态文件由 nginx 自己发头，没有上游 Cache-Control 可隐藏，
        # 直接 add_header 即可（本 location 无 proxy_hide_header，不存在覆盖问题）
        add_header Cache-Control $mei_cache_control;
        sub_filter '</head>' '<script src="/__shell/topbar.js?v=20260910" data-app="omni-tools"></script></head>';
        sub_filter_once on;
    }
   location = /tools {
        if ($mei_is_doc) { return 418; }
       return 301 /tools/$is_args$args;
    }

    # ai-draw：静态 nginx 服务 dist + API 反代 Express（strip /draw）
    location /draw/api/ {
        rewrite ^/draw(/api/.*)$ $1 break;
        proxy_pass http://mei_draw;
        proxy_http_version 1.1;
    }
   location /draw/ {
        if ($mei_is_doc) { return 418; }
       alias /app/apps/draw/dist/;
        try_files $uri $uri/ /draw/index.html;
        add_header Cache-Control $mei_cache_control;
        sub_filter_types text/html application/javascript text/javascript;
        # JS 里硬编码根级绝对路径的图片（/quick-start-example-1.png 等）→ 改写为 /draw/ 前缀
        # 否则浏览器请求 /xxx.png → 命中根 / location（Shell）→ 404
        sub_filter '"/quick-start-example-1.png"' '"/draw/quick-start-example-1.png"';
        sub_filter '"/ali-pay.png"' '"/draw/ali-pay.png"';
        sub_filter '"/contact-single.png"' '"/draw/contact-single.png"';
        sub_filter '"/wechart-pay.png"' '"/draw/wechart-pay.png"';
        # 注入顶栏（嵌入模式 ?meiEmbed=1 由 topbar.js 自行检测跳过渲染）
        sub_filter '</head>' '<script src="/__shell/topbar.js?v=20260910" data-app="ai-draw"></script></head>';
        sub_filter_once off;
    }
   location = /draw {
        if ($mei_is_doc) { return 418; }
       return 301 /draw/$is_args$args;
    }

    # music 音乐播放（原 Solara，Node + 原生 JS，子路径 /music）—— 资源 + API 路径重写 + 顶栏
   location /music/ {
        if ($mei_is_doc) { return 418; }
       proxy_pass http://mei_music/;
        # 上游 302 重定向改写回子路径：cookie 失效时 solara 会 302 到绝对路径 /login，
        # 不改写则浏览器跳到门户 /login（表现为“跳到首页”），改写后落在 /music/login。
        # 仅改写同 host 与根相对重定向，避免破坏 /proxy 对外部资源地址的重定向；
        # 排除 /music 本身防止重复加前缀
        proxy_redirect ~^https?://$http_host/(?!music(?:/|$))(.*)$ /music/$1;
        proxy_redirect ~^/(?!music(?:/|$))(.*)$ /music/$1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_buffering off;
        include /etc/nginx/snippets/cache-policy.conf;
        sub_filter_types text/html application/javascript text/javascript text/css;
        # API/路由绝对路径加子路径前缀
        sub_filter '"/api/' '"/music/api/';
        sub_filter "'/api/" "'/music/api/";
        sub_filter '"/proxy' '"/music/proxy';
        sub_filter "'/proxy" "'/music/proxy";
        sub_filter '"/palette' '"/music/palette';
        sub_filter "'/palette" "'/music/palette";
        sub_filter '"/login' '"/music/login';
        sub_filter "'/login" "'/music/login";
        sub_filter '"/css/' '"/music/css/';
        sub_filter '"/js/' '"/music/js/';
        # 注入顶栏（嵌入模式 ?meiEmbed=1 由 topbar.js 自行检测跳过渲染）
        sub_filter '</head>' '<script src="/__shell/topbar.js?v=20260910" data-app="solara"></script></head>';
        sub_filter_once off;
    }
   location = /music {
        if ($mei_is_doc) { return 418; }
       return 301 /music/$is_args$args;
    }


    # mediago 流媒体下载（media core-ts Node 引擎，子路径 /media）—— 同步注入 apiKey + 资源路径 + 顶栏 + 路由前缀修正
   location /media/ {
        if ($mei_is_doc) { return 418; }
       rewrite ^/media(/.*)$ $1 break;
        proxy_pass http://mei_media;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        include /etc/nginx/snippets/cache-policy.conf;
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter 'src="/assets/' 'src="/media/assets/';
        sub_filter 'href="/assets/' 'href="/media/assets/';
        sub_filter '"/assets/' '"/media/assets/';
        sub_filter '"/api/' '"/media/api/';
        sub_filter '"/signin' '"/media/signin';
        # manifest.json：mediago HTML 用根路径 href="/manifest.json"，重写为 /media/manifest.json 避免命中根 location
        sub_filter 'href="/manifest.json"' 'href="/media/manifest.json"';
        # 注入 apiKey + 顶栏（嵌入模式 ?meiEmbed=1 由 topbar.js 自行检测跳过渲染）
        # 路由前缀适配已改为前端 BrowserRouter basename="/media"（main.tsx），不再用 Location.pathname 补丁
        sub_filter '</head>' '<script>try{var x=new XMLHttpRequest();x.open("GET","/api/auth/me",false);x.withCredentials=true;x.send();if(x.status===200){var d=JSON.parse(x.responseText);if(d.tokens&&d.tokens.mediago){var s=localStorage.getItem("appstore-storage")||"{}";var p=JSON.parse(s);if(!p.state||typeof p.state!=="object")p.state={};p.state.apiKey=d.tokens.mediago;p.version=p.version||0;localStorage.setItem("appstore-storage",JSON.stringify(p));}}}catch(e){}</script><script src="/__shell/topbar.js?v=20260910" data-app="mediago"></script></head>';
        sub_filter_once off;
    }
    # mediago manifest.json：返回最小有效 manifest，避免浏览器报 Manifest 语法错误
    # mediago 没有真正的 manifest（/manifest.json 返回 index.html SPA fallback → HTML → 语法错误）
    location = /media/manifest.json {
        default_type application/json;
        return 200 '{"name":"MediaGo","short_name":"MediaGo","start_url":"/media/","display":"standalone","background_color":"#ffffff","theme_color":"#1976d2","icons":[]}';
    }
   location = /media {
        if ($mei_is_doc) { return 418; }
       return 301 /media/$is_args$args;
    }

    # disks 网盘搜索（Node/TS 引擎 + Vue SPA，子路径 /disks；Go 引擎已退役）
    location /disks/api/ {
        rewrite ^/disks(/api/.*)$ $1 break;
        proxy_pass http://mei_disks;
        include /etc/nginx/snippets/forwarded-headers.conf;
        proxy_set_header Referer $http_referer;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location /disks/qqpd/ {
        rewrite ^/disks(/qqpd/.*)$ $1 break;
        proxy_pass http://mei_disks;
        proxy_redirect ~^/(?!disks(?:/|$))(.*)$ /disks/$1;
        proxy_redirect ~^https?://$http_host/(?!disks(?:/|$))(.*)$ /disks/$1;
        include /etc/nginx/snippets/forwarded-headers.conf;
        proxy_set_header Referer $http_referer;
        proxy_buffering off;
    }
    location /disks/gying/ {
        rewrite ^/disks(/gying/.*)$ $1 break;
        proxy_pass http://mei_disks;
        proxy_redirect ~^/(?!disks(?:/|$))(.*)$ /disks/$1;
        proxy_redirect ~^https?://$http_host/(?!disks(?:/|$))(.*)$ /disks/$1;
        include /etc/nginx/snippets/forwarded-headers.conf;
        proxy_set_header Referer $http_referer;
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    location /disks/weibo/ {
        rewrite ^/disks(/weibo/.*)$ $1 break;
        proxy_pass http://mei_disks;
        proxy_redirect ~^/(?!disks(?:/|$))(.*)$ /disks/$1;
        proxy_redirect ~^https?://$http_host/(?!disks(?:/|$))(.*)$ /disks/$1;
        include /etc/nginx/snippets/forwarded-headers.conf;
        proxy_set_header Referer $http_referer;
        proxy_buffering off;
    }
    location /disks/panlian/ {
        rewrite ^/disks(/panlian/.*)$ $1 break;
        proxy_pass http://mei_disks;
        proxy_redirect ~^/(?!disks(?:/|$))(.*)$ /disks/$1;
        proxy_redirect ~^https?://$http_host/(?!disks(?:/|$))(.*)$ /disks/$1;
        include /etc/nginx/snippets/forwarded-headers.conf;
        proxy_set_header Referer $http_referer;
        proxy_buffering off;
    }
   location /disks/ {
        if ($mei_is_doc) { return 418; }
       alias /app/apps/disks/frontend/dist/;
        try_files $uri $uri/ /disks/index.html;
        add_header Cache-Control $mei_cache_control;
        sub_filter_types text/html application/javascript text/javascript text/css;
        sub_filter 'src="/assets/' 'src="/disks/assets/';
        sub_filter 'href="/assets/' 'href="/disks/assets/';
        sub_filter 'href="/favicon.ico"' 'href="/disks/favicon.ico"';
        sub_filter '"/api/' '"/disks/api/';
        sub_filter "'/api/" "'/disks/api/";
        sub_filter '"/qqpd/' '"/disks/qqpd/';
        sub_filter "'/qqpd/" "'/disks/qqpd/";
        sub_filter '"/gying/' '"/disks/gying/';
        sub_filter "'/gying/" "'/disks/gying/";
        sub_filter '"/weibo/' '"/disks/weibo/';
        sub_filter "'/weibo/" "'/disks/weibo/";
        sub_filter '"/panlian/' '"/disks/panlian/';
        sub_filter "'/panlian/" "'/disks/panlian/";
        sub_filter 'baseURL:"/api"' 'baseURL:"/disks/api"';
        sub_filter "baseURL:'/api'" "baseURL:'/disks/api'";
        sub_filter 'baseURL:"/qqpd"' 'baseURL:"/disks/qqpd"';
        sub_filter "baseURL:'/qqpd'" "baseURL:'/disks/qqpd'";
        sub_filter 'baseURL:"/gying"' 'baseURL:"/disks/gying"';
        sub_filter "baseURL:'/gying'" "baseURL:'/disks/gying'";
        sub_filter 'baseURL:"/weibo"' 'baseURL:"/disks/weibo"';
        sub_filter "baseURL:'/weibo'" "baseURL:'/disks/weibo'";
        sub_filter 'baseURL:"/panlian"' 'baseURL:"/disks/panlian"';
        sub_filter '</head>' '<script src="/__shell/topbar.js?v=20260910" data-app="pansou"></script></head>';
        sub_filter_once off;
    }
   location = /disks {
        if ($mei_is_doc) { return 418; }
       return 301 /disks/$is_args$args;
    }

    # Legacy Pansou /search paths redirect to /disks.
    # 旧路径（书签/外部链接）统一 301 到 /disks 同路径；/search 精确路径是 Shell 综合搜索页
    location /search/api/ {
        rewrite ^/search(/api/.*)$ /disks$1 permanent;
    }
    location /search/qqpd/ {
        rewrite ^/search(/qqpd/.*)$ /disks$1 permanent;
    }
    location /search/gying/ {
        rewrite ^/search(/gying/.*)$ /disks$1 permanent;
    }
    location /search/weibo/ {
        rewrite ^/search(/weibo/.*)$ /disks$1 permanent;
    }
    location /search/panlian/ {
        rewrite ^/search(/panlian/.*)$ /disks$1 permanent;
    }
    # 其余 /search/* 旧书签/旧链接统一 301 到 /disks 同路径
    # （不再重复服务一份 disks SPA：整套 sub_filter 改写规则已在 /disks/ 维护，
    #   两份副本改版时极易漂移；/search 精确路径是 Shell 综合搜索页，见下方 location = /search）
    location /search/ {
        rewrite ^/search(/.*)$ /disks$1 permanent;
    }
    location = /search {
        proxy_pass http://mei_shell;
    }
}
