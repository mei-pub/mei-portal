# 静态资源缓存策略的落地点（策略值见 nginx.conf 的 $mei_static_cache / $mei_cache_control）。
#
# 为什么必须在每个 location 里 include，而不是只放在 server 级：
# nginx 的 proxy_hide_header 与 add_header 都**不跨层级继承** —— 只要 location 自己
# 写了任意一条同名指令（/music/、/tv 等都有 proxy_hide_header X-Frame-Options），
# server 级的整份列表就会被整体覆盖，表现为响应里出现两条 Cache-Control
# （上游的 max-age=0 + 我们的长缓存），浏览器取更严格的那条，缓存等于没加。
#
# 同一个 location 内多条 proxy_hide_header 是累加的，所以在已有 proxy_hide_header 的
# location 里 include 本文件是安全的。
proxy_hide_header Cache-Control;
add_header Cache-Control $mei_cache_control;
