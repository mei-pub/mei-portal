[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:shell]
command=node /app/server.js
directory=/app
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0",MEI_MODE="single"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:tutorial]
command=node /app/apps/tutorial/server.js
directory=/app/apps/tutorial
environment=NODE_ENV="production",PORT="3001",HOSTNAME="0.0.0.0",DATA_DIR="/data/tutorial"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:mei-link]
command=node --experimental-strip-types src/server.ts
directory=/app/apps/mei-link
environment=NODE_ENV="production",MEILINK_WEB_PORT="3002",MEILINK_DATA_DIR="/data/mei-link",MEILINK_FRPC_PATH="/usr/local/bin/frpc",MEILINK_ADMIN_USER="%(ENV_MEI_ADMIN_USER)s",MEILINK_ADMIN_PASSWORD="%(ENV_MEI_ADMIN_PASSWORD)s"
autostart=true
autorestart=true
startretries=10
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:lunatv]
command=node /app/apps/lunatv/server.js
directory=/app/apps/lunatv
environment=NODE_ENV="production",PORT="3003",HOSTNAME="0.0.0.0",NEXT_PUBLIC_STORAGE_TYPE="localstorage",PASSWORD="%(ENV_MEI_ADMIN_PASSWORD)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:ai-draw]
command=node server/index.js
directory=/app/apps/ai-draw
environment=NODE_ENV="production",PORT="3004",DATA_DIR="/data/ai-draw"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:solara]
command=node index.js
directory=/app/apps/solara/server
environment=NODE_ENV="production",PORT="3005",HOST="0.0.0.0",PASSWORD="%(ENV_MEI_ADMIN_PASSWORD)s",DATA_DIR="/data/solara"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
