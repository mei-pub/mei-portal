[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:shell]
command=node /app/server.js
directory=/app
environment=NODE_ENV="production",PORT="3010",HOSTNAME="0.0.0.0"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:novels]
command=node /app/apps/novels/server.js
directory=/app/apps/novels
environment=NODE_ENV="production",PORT="3001",HOSTNAME="0.0.0.0",DATA_DIR="/data/novels",MEI_HIDDEN_LIBRARY_PASSWORD="%(ENV_MEI_ADMIN_PASSWORD)s",MEI_ADMIN_PASSWORD="%(ENV_MEI_ADMIN_PASSWORD)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:link]
command=node --experimental-strip-types src/server.ts
directory=/app/apps/link
environment=NODE_ENV="production",MEILINK_WEB_PORT="3002",MEILINK_DATA_DIR="/data/link",MEILINK_FRPC_PATH="/usr/local/bin/frpc",MEILINK_ADMIN_USER="%(ENV_MEI_ADMIN_USER)s",MEILINK_ADMIN_PASSWORD="%(ENV_MEI_ADMIN_PASSWORD)s"
autostart=true
autorestart=true
startretries=10
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:tv]
command=node /app/apps/tv/server.js
directory=/app/apps/tv
environment=NODE_ENV="production",PORT="3003",HOSTNAME="0.0.0.0",NEXT_PUBLIC_STORAGE_TYPE="localstorage",DATA_DIR="/data/tv",PASSWORD="%(ENV_MEI_ADMIN_PASSWORD)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:draw]
command=node server/index.js
directory=/app/apps/draw
environment=NODE_ENV="production",PORT="3004",DATA_DIR="/data/draw",MEI_ADMIN_USER="%(ENV_MEI_ADMIN_USER)s",MEI_ADMIN_PASSWORD="%(ENV_MEI_ADMIN_PASSWORD)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:music]
command=node index.js
directory=/app/apps/music/server
environment=NODE_ENV="production",PORT="3005",HOST="0.0.0.0",PASSWORD="%(ENV_MEI_ADMIN_PASSWORD)s",DATA_DIR="/data/music",YT_DLP_PATH="/usr/local/bin/yt-dlp"
autostart=true
autorestart=true
# 音乐下载会派生 yt-dlp 子进程：SIGTERM 后按进程组收尾，留足时间等子进程退出
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:bgutil]
command=node build/main.js --port 4416
directory=/app/apps/bgutil
environment=NODE_ENV="production",TOKEN_TTL="6"
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=25

[program:media]
command=node --experimental-strip-types /app/apps/media/core-ts/src/server.ts --port=3000 --static-dir=/app/apps/media/static --db-path=/data/media/mediago.db --config-dir=/data/media --log-dir=/data/media/logs --local-dir=/data/media/downloads --deps-dir=/app/apps/media/deps
directory=/app/apps/media/core-ts
environment=NODE_ENV="production"
autostart=true
autorestart=true
startsecs=2
# media core-ts 的 SIGTERM 处理是 kill 全部下载子进程；supervisord 默认 10s
# stopwaitsecs 在 docker stop（默认 10s）下不够稳妥，显式放宽并按进程组收尾
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:disks]
command=node --experimental-strip-types src/server.ts
directory=/app/apps/disks/engine
environment=PORT="3008",PANSOU_PORT="3008",PANSOU_HOST="127.0.0.1",CACHE_PATH="/data/disks/cache",LOG_PATH="/data/disks/logs",ENABLED_PLUGINS="dyyjpro,duoduo,djgou,gaoqing888,hdmoli,haitunsou,hunhepan,ikantv,jutoushe,kkv,dy4k,melost,meitizy,ouge,pansearch,quarksoo,ting77,wanou,xb6v,xiaokupan,xiaozhang,xiaoyu,yunso,yunsou,diduan,erxiao,huban,labi,shandian,zhizhen,clxiong,jsnoteclub,ciligou,dyyj,jupansou,clmao,susu,u3c3,5266ys,dygang,leso,gying,weibo,qqpd,panlian,thepiratebay,nyaa,quarkres,btbtlb,dygod,cldi",CHANNELS="tgsearchers6,Aliyun_4K_Movies,bdbdndn11,yunpanx,bsbdbfjfjff,yp123pan,sbsbsnsqq,yunpanxunlei,tianyifc,BaiduCloudDisk,txtyzy,peccxinpd,gotopan,PanjClub,kkxlzy,baicaoZY,MCPH01,MCPH02,MCPH03,bdwpzhpd,ysxb48,jdjdn1111,yggpan,MCPH086,zaihuayun,Q66Share,ucwpzy,shareAliyun,alyp_1,dianyingshare,dianying4k,Quark_Movies,XiangxiuNBB,ydypzyfx,ucquark,xx123pan,yingshifenxiang123,zyfb123,tyypzhpd,tianyirigeng,cloudtianyi,hdhhd21,Lsp115,oneonefivewpfx,qixingzhenren,taoxgzy,Channel_Shares_115,tyysypzypd,vip115hot,wp123zy,yunpan139,yunpan189,yunpanuc,yydf_hzl,leoziyuan,pikpakpan,Q_dongman,yoyokuakeduanju,TG654TG,WFYSFX02,QukanMovie,yeqingjie_GJG666,movielover8888_film3,Baidu_netdisk,D_wusun,FLMdongtianfudi,KaiPanshare,QQZYDAPP,rjyxfx,PikPak_Share_Channel,btzhi,newproductsourcing,cctv1211,duan_ju,QuarkFree,yunpanNB,kkdj001,xxzlzn,pxyunpanxunlei,jxwpzy,kuakedongman,liangxingzhinan,xiangnikanj,solidsexydoll,guoman4K,zdqxm,kduanju,cilidianying,CBduanju,SharePanFilms,dzsgx,BooksRealm,Oscar_4Kmovies,douerpan,baidu_yppan,Q_jilupian,Netdisk_Movies,yunpanquark,ammmziyuan,ciliziyuanku,cili8888,jzmm_123pan,wpan8,mqte5,regengguangya,yunpanguangya,regeng115,regeng123,yoyokuakeduanjujiaoliuqun,yy80986098,pan_guangya,guangyapan_episode,AV688",AUTH_ENABLED="false",UV_THREADPOOL_SIZE="8"
# UV_THREADPOOL_SIZE=8：113 个 TG 频道并发抓取时 DNS(getaddrinfo) 走 libuv 线程池，
# 默认 4 线程在弱网下成为瓶颈（B 域超时审计遗留建议）
autostart=true
autorestart=true
startsecs=3
startretries=5
# disks 引擎的 SIGTERM 处理是落盘缓存后退出（约 2s）：给足 stopwaitsecs 防止
# 缓存被 SIGKILL 截断（docker stop 宽限期由 compose 的 stop_grace_period 放宽）
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

